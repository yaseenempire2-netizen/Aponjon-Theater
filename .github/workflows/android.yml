name: Build Aponjon Theater APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          PROJECT_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Project folder not found"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          rm -rf extracted
          rm -rf node_modules
          rm -rf client/node_modules
          rm -rf server/node_modules

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aponjon-Theater-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
